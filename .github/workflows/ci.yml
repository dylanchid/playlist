name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check TypeScript compilation
      run: npm run typecheck
      
    - name: Run Linter
      run: npm run lint
      
    - name: Run Unit Tests
      run: npm run test
      
    - name: Production build
      run: npm run build
      
    # Note: E2E tests (Playwright) would be added here in the future
